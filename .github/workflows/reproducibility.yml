name: Reproducibility checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  strict-subject-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install lightweight analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Compile Python sources
        run: python -m compileall -q run.py src scripts tests
      - name: Validate split logic and manuscript source data
        run: python -m unittest discover -s tests -v
